name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  big-endian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Install qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      # linux/mips is 32-bit big-endian, so it checks wire encoding and
      # decoding does not depend on host byte order.
      - name: Test (linux/mips)
        env:
          GOARCH: mips
        run: go test -exec qemu-mips-static -shuffle=on -count=1 -timeout=30m ./...

  fuzz-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: List fuzz targets
        id: list
        run: |
          targets=$(for dir in $(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.Dir}}{{end}}' ./...); do
            rel=.${dir#"$PWD"}
            { go test -list '^Fuzz' "$rel" || true; } | grep '^Fuzz' | jq -R --arg dir "$rel" '{dir: $dir, name: .}' || true
          done | jq -sc .)
          echo "$targets" | jq .
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

  fuzz:
    needs: [fuzz-targets]
    name: fuzz (${{ matrix.target.dir }} ${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    env:
      DIR: ${{ matrix.target.dir }}
      NAME: ${{ matrix.target.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Locate corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >>"$GITHUB_OUTPUT"

      # The inputs generated while fuzzing live in GOCACHE. Keeping them lets
      # each night continue from the coverage the previous ones reached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.target.dir }}-${{ matrix.target.name }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target.dir }}-${{ matrix.target.name }}-

      - name: Fuzz
        run: go test -run '^$' -fuzz "^${NAME}\$" -fuzztime=1h "$DIR"

      # A failing input is written to testdata/fuzz. Commit it to the package
      # so it runs as a regression test with go test.
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ strategy.job-index }}-${{ matrix.target.name }}
          path: ${{ matrix.target.dir }}/testdata/fuzz/${{ matrix.target.name }}

  # Repeats the suite in random order under the race detector, to catch tests
  # that pass only most of the time.
  flaky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test (race, shuffle, repeated)
        run: go test -race -shuffle=on -count=100 -timeout=60m ./...
