name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l -d . 2>&1) || true
          if [ -n "$unformatted" ]; then
            echo "::error::File(s) not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (tinygo tags)
        run: go vet -tags=tinygo ./...

      - name: go fix
        run: |
          diff=$(go fix -diff ./... 2>&1) || true
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "::error::Files need go tool fix. Run: go tool fix ./..."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Build
        run: go build -v ./...

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test
        run: |
          mkdir -p profiles
          go test -v -shuffle=on -count=1 \
            -coverprofile=profiles/coverage.profile -covermode=atomic -coverpkg=./... \
            -timeout=10m \
            ./...

      - name: Upload coverage
        uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: profiles/coverage.profile
          slug: soypat/lneto

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-profiles
          path: profiles/
          retention-days: 14

  race:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test (race + shuffle)
        run: go test -race -shuffle=on -count=1 -timeout=10m ./...

  benchmark:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Run benchmarks
        run: |
          set -euo pipefail
          go test -bench=. -benchmem -count=1 -shuffle=on -run='^$' -timeout=15m ./... | tee bench-results.txt

      - name: Reject benchmark allocations
        run: |
          awk '
            /^Benchmark/ {
              for (i = 2; i <= NF; i++) {
                if (($i == "B/op" || $i == "allocs/op") && $(i - 1) != 0) {
                  print "::error::benchmark allocates: " $0
                  failed = 1
                }
              }
            }
            END { exit failed }
          ' bench-results.txt

      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench-results.txt
          retention-days: 30

  binary-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: current

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - uses: acifani/setup-tinygo@dd8a7075d951a7595b2ef2123ed0ab1af0c13e56 # v3.0.0
        with:
          tinygo-version: "0.41.1"
          install-binaryen: "false"

      - name: Build main revision
        working-directory: main/examples/min-working-example
        run: tinygo build -target=pico -o /tmp/main.bin .

      - name: Build current revision
        working-directory: current/examples/min-working-example
        run: tinygo build -target=pico -o /tmp/current.bin .

      - name: Compare TinyGo binary size
        run: |
          main_size=$(wc -c < /tmp/main.bin)
          current_size=$(wc -c < /tmp/current.bin)
          delta=$((current_size - main_size))
          {
            printf '<!-- lneto-bench -->\n\n'
            printf '### TinyGo binary size\n\n'
            printf '| Target | Main | PR | Diff |\n'
            printf '|---|---:|---:|---:|\n'
            printf '| Pico | %d bytes | %d bytes | %+d bytes |\n' "$main_size" "$current_size" "$delta"
          } > bench-report.md
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$delta" -gt 0 ]; then
            printf '::error::Pico binary grew by %d bytes\n' "$delta"
            exit 1
          fi

      - name: Upload generated size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-report
          path: bench-report.md
          retention-days: 30
