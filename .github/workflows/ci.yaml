name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l -d . 2>&1) || true
          if [ -n "$unformatted" ]; then
            echo "::error::File(s) not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (tinygo tags)
        run: go vet -tags=tinygo ./...

      - name: go fix
        run: |
          diff=$(go fix -diff ./... 2>&1) || true
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "::error::Files need go tool fix. Run: go tool fix ./..."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Build
        run: go build -v ./...

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test
        run: |
          mkdir -p profiles
          go test -v -shuffle=on -count=1 \
            -coverprofile=profiles/coverage.profile -covermode=atomic -coverpkg=./... \
            -timeout=10m \
            ./...

      - name: Upload coverage
        uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: profiles/coverage.profile
          slug: soypat/lneto

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-profiles
          path: profiles/
          retention-days: 14

  race:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test (race + shuffle)
        run: go test -race -shuffle=on -count=1 -timeout=10m ./...

  test-matrix:
    needs: [build]
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum Go version declared in go.mod.
          - name: go1.24
            go: "1.24"
            runner: ubuntu-latest
          # 32-bit, the int and pointer size of TinyGo targets.
          - name: linux/386
            go: "1.26"
            runner: ubuntu-latest
            goarch: "386"
          - name: linux/arm64
            go: "1.26"
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: go test -shuffle=on -count=1 -timeout=10m ./...

  build-tags:
    needs: [build]
    name: test (tags=${{ matrix.tags }})
    strategy:
      fail-fast: false
      matrix:
        tags: [onlytcp, noslog, xnetdebug, debugheaplog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: go vet
        run: go vet -tags=${{ matrix.tags }} ./...

      - name: Test
        run: go test -tags=${{ matrix.tags }} -shuffle=on -count=1 -timeout=10m ./...

  cross-vet:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      # go vet type-checks test files too, so it catches more than go build.
      - name: go vet (cross-compiled)
        run: |
          failed=0
          for target in darwin/arm64 windows/amd64 linux/arm linux/riscv64 linux/mips wasip1/wasm js/wasm; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || { echo "::error::go vet failed for $target"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

  memci:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # Needed because a build command in memci.json names tinygo. Keep the two
      # versions in step: TinyGo 0.42 builds with Go 1.25 through 1.27 and
      # refuses to run outside that window, in either direction.
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.42.0"
      - uses: soypat/memci@main
        with:
          args: -kind package
          targets: .github/workflows/memci.json
