name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l -d . 2>&1) || true
          if [ -n "$unformatted" ]; then
            echo "::error::File(s) not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (tinygo tags)
        run: go vet -tags=tinygo ./...

      - name: go fix
        run: |
          diff=$(go fix -diff ./... 2>&1) || true
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "::error::Files need go tool fix. Run: go tool fix ./..."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Build
        run: go build -v ./...

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test
        run: |
          mkdir -p profiles
          go test -v -shuffle=on -count=1 \
            -coverprofile=profiles/coverage.profile -covermode=atomic -coverpkg=./... \
            -timeout=10m \
            ./...

      - name: Upload coverage
        uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: profiles/coverage.profile
          slug: soypat/lneto

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-profiles
          path: profiles/
          retention-days: 14

  race:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Test (race + shuffle)
        run: go test -race -shuffle=on -count=1 -timeout=10m ./...

  benchmark:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Run benchmarks
        run: |
          set -euo pipefail
          go test -bench=. -benchmem -count=1 -shuffle=on -run='^$' -timeout=15m ./... | tee bench-results.txt

      # Allocation tracking is Go-only for now: TinyGo 0.41.1 does not implement
      # testing.B.Loop (which every benchmark here uses), so `tinygo test -bench`
      # cannot run them. Revisit once TinyGo supports it to also gate TinyGo allocs.
      - name: Reject benchmark allocations
        run: |
          awk '
            /^Benchmark/ {
              for (i = 2; i <= NF; i++) {
                if (($i == "B/op" || $i == "allocs/op") && $(i - 1) != 0) {
                  print "::error::benchmark allocates: " $0
                  failed = 1
                }
              }
            }
            END { exit failed }
          ' bench-results.txt

      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench-results.txt
          retention-days: 30

  binary-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: current

      - name: Checkout main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - uses: acifani/setup-tinygo@dd8a7075d951a7595b2ef2123ed0ab1af0c13e56 # v3.0.0
        with:
          tinygo-version: "0.41.1"
          install-binaryen: "false"

      # The example is built with both toolchains: a pattern that is heapless
      # under one can allocate under the other, so tracking both sizes is what
      # catches a TinyGo-only regression the normal Go build would miss.
      - name: Build binaries
        run: |
          set -euo pipefail
          for rev in main current; do
            (
              cd "$rev/examples/min-working-example"
              go build -o "/tmp/$rev-go" .
              tinygo build -target=pico -o "/tmp/$rev-pico.bin" .
            )
          done

      - name: Compare binary sizes
        run: |
          set -euo pipefail
          {
            printf '<!-- lneto-bench -->\n\n'
            printf '### Binary size\n\n'
            printf '| Target | Main | PR | Diff |\n'
            printf '|---|---:|---:|---:|\n'
          } > bench-report.md
          # mode "gate" fails the job on growth; "report" only records the number.
          # Only the embedded (TinyGo) target is gated: the amd64 Go binary is
          # large and drifts with unrelated base-vs-head changes, so failing on it
          # would be noisy. Its size is still tracked for visibility.
          regressed=0
          for target in "amd64 Go:go:report" "Pico TinyGo:pico.bin:gate"; do
            IFS=: read -r label file mode <<<"$target"
            main_size=$(wc -c < "/tmp/main-$file")
            current_size=$(wc -c < "/tmp/current-$file")
            delta=$((current_size - main_size))
            printf '| %s | %d bytes | %d bytes | %+d bytes |\n' \
              "$label" "$main_size" "$current_size" "$delta" >> bench-report.md
            if [ "$mode" = gate ] && [ "$delta" -gt 0 ]; then
              printf '::error::%s binary grew by %d bytes\n' "$label" "$delta"
              regressed=1
            fi
          done
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$regressed"

      - name: Upload generated size report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-report
          path: bench-report.md
          if-no-files-found: ignore
          retention-days: 30
